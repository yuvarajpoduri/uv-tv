<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="bbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="bbBoxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Black Background -->
  <rect width="512" height="512" rx="110" fill="url(#blackBg)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#059669" stroke-width="4" stroke-opacity="0.3" />

  <!-- Periodic Table Br Box -->
  <g transform="translate(106, 106)">
    <!-- Dark Green Chemical Square Frame -->
    <rect width="300" height="300" rx="32" fill="url(#bbBoxBg)" stroke="#10b981" stroke-width="12" filter="url(#greenGlow)" />

    <!-- Atomic Number (35) Top Left -->
    <text x="32" y="64" fill="#a7f3d0" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="34">35</text>

    <!-- Atomic Mass (79.90) Top Right -->
    <text x="268" y="64" text-anchor="end" fill="#34d399" font-family="monospace" font-weight="700" font-size="22">79.90</text>

    <!-- Br Symbol Centered -->
    <text x="150" y="210" text-anchor="middle" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-weight="800" font-size="140" filter="url(#greenGlow)">Br</text>

    <!-- Subtext Bromine -->
    <text x="150" y="268" text-anchor="middle" fill="#a7f3d0" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="24" letter-spacing="3">BROMINE</text>
  </g>
</svg>
