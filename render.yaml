services:
  - type: web
    name: tv-log-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: USER_ONE_USERNAME
        sync: false
      - key: USER_ONE_PASSWORD
        sync: false
      - key: USER_TWO_USERNAME
        sync: false
      - key: USER_TWO_PASSWORD
        sync: false

  - type: web
    name: tv-log-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
